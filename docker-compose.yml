version: "3.9"

services:
  message:
    build:
      context: .
      dockerfile: ./python/message/Dockerfile
    env_file:
      - ./python/message/.env
    container_name: message-service
    ports:
      - "50052:50052"
    networks:
      - app-network

  user:
    build:
      context: .
      dockerfile: ./python/user/Dockerfile
    env_file:
      - ./python/user/.env
    container_name: user-service
    ports:
      - "50051:50051"
    networks:
      - app-network

  gateway:
    build:
      context: .
      dockerfile: ./gateway/api/Dockerfile
    container_name: gateway-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - USER_GRPC_HOST=user
      - MESSAGE_GRPC_HOST=message
      - HOST_IP=${HOST_IP}
    depends_on:
      - user
      - message
    networks:
      - app-network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: http://gateway:8080
    container_name: svelte-ui
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - app-network

networks:
  app-network:
    driver: bridge